<!--
  Video promocional de ~30 s, estilo Apple, al ritmo de la música.
  Edita solo CONFIG (abajo). Las imágenes van en assets.js (scripts/pack.mjs) y la música en CONFIG.audio.
  Vista previa: abre el archivo y haz clic para que suene. Formato: ?w=1080&h=1920 (vertical) o ?w=1080&h=1080 (cuadrado).
  Render: scripts/render.sh (cuadro por cuadro con motion blur).
-->
<script>
window.CONFIG = {
  audio: 'audio.m4a',
  duration: 30,
  // Ritmo: sale de `node scripts/beats.mjs audio.m4a` (bpm y primer golpe en segundos).
  bpm: 114, firstBeat: 0.08,
  // Los «3 golpes» de la música, en segundos. Si el usuario los da como mm:ss:cc (cuadros a 30 fps), 00:05:09 = 5 + 9/30.
  hits: [[5.30, 5.83, 6.37], [15.83, 16.37, 16.90], [24.27, 24.83, 25.30]],
  hitWords: [['Vende.', 'Cobra.', '*Controla.'], ['Efectivo.', '*QR.', 'Tarjeta.'], ['Más ágil.', 'Más ventas.', '*Al máximo.']],
  // Guion. Un * delante de una palabra la pone en degradado.
  strike: ['Cuaderno.', 'Excel.', 'Calculadora.', 'Papelitos.'],   // compás 0: lo de antes, tachado en cada golpe
  problem: ['No más', '*descontrol.'],                              // compás 1: la segunda línea se descifra y estalla
  promise: ['Todo simple,', 'a la mano'],                           // logo + frase + píldora con «+»
  laptopHead: 'Tus ventas, *al *instante.',
  stack: ['Cada venta.', 'Cada peso.', 'Cada producto.'], stackEnd: 'Bajo *control.',
  bridge: 'Cobra como *quieras.',                                   // antes del segundo grupo de golpes
  phoneHead: 'Cobra *con *QR.',
  decode: 'Tu stock, *al *día.',                                    // se descifra letra por letra
  duoHead: '*Compu *y *celular.',
  tiles: ['Bs', 'QR', '+1', '✓', '%', 'Bs', '★', '+', 'QR', '✓'],  // fichas que flotan alrededor del celular
  brand: { name: 'Maximo', tagline: 'Agiliza tu negocio al máximo.', url: 'maximo.work', appStore: true, googlePlay: true },
  // Parches sobre las capturas (coordenadas en píxeles de la captura): tapar un nombre viejo, poner fotos de productos…
  // { img: 'p1', x, y, w, h, r }   → imagen de assets.js recortada para cubrir el rectángulo
  // { fill: '#fff', x, y, w, h }    → rectángulo de color
  // { text: 'Hola', x, y, font: '600 30px Poppins', color: '#111', align: 'left' }
  patches: { laptop: [], phone: [] },
};
</script>

          [br(10), above(3, -1.2, 1.7), E.in], [br(11) - .11, above(3, -1.2, 1.7)], [br(11) - .1, below(4, -2, 1.3)], [br(11) + 1.0, duoP, E.out], [HIT[2][0] - .25, { ...duoP, ry: duoP.ry + .12 }], [HIT[2][0] + .05, above(3, -2, 1.3), E.in]],

        [br(11) - .01, { x: -.6, y: .6, z: 7.2, tx: 0, ty: .4 }], [br(11), { x: .8, y: 1.5, z: 10.6, tx: .4, ty: .1 }], [HIT[2][0], { x: -.3, y: 1.2, z: 9.8, tx: .4, ty: .1 }, E.io], [DUR, { x: -.3, y: 1, z: 9.8, tx: .4, ty: .1 }]],

// ---------- tipografía cinética ----------
function pieces(el, list, unit) { // list: [[texto, 'g'?], ...]; unit: 'ch' (letra por letra) | 'w' (palabra)
  el.innerHTML = ''; const out = [];
  list.forEach(([txt, cls], wi) => {
    const w = document.createElement('span'); w.className = 'w'; el.appendChild(w);

}
const words = s => s.split(' ').map(w => w.startsWith('*') ? [w.slice(1), 'g'] : [w, '']);
const one = s => s.startsWith('*') ? [s.slice(1), 'g'] : [s, ''];
function rise(ps, t, a, b, stag, { dy = .8, rot = 10, blur = 18 } = {}) { // sube, gira y se enfoca, escalonado; sale hacia arriba

  });

function slam(el, t, a, b, d = .38) { // golpe: entra grande y desenfocado, sale justo en el golpe siguiente

}
function seq(el, t, items, times, end, d) { // una palabra por golpe

  if (i < 0 || t > end + .05) { el.style.opacity = 0; return -1; }
  const [w, g] = one(items[i]); if (el.dataset.w !== w) { el.textContent = w; el.dataset.w = w; el.classList.toggle('grad', !!g); }

}
const GLY = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&$?!';
function scramble(ps, t, a, b, stag, shatter) { // letras al azar que se fijan una por una; con shatter, estallan al salir

    if (p.dataset.c === undefined) p.dataset.c = p.textContent;

    const r = Math.sin(i * 12.9898) * 43758.5453 % 1, sx = shatter ? o * r * 3 : 0, sy = shatter ? -o * (1 + (i % 3)) * .6 : -o * .5;

}
const twoLines = (el, s) => { // en vertical, las frases largas van en dos líneas
  if (!PORT) return pieces(el, words(s), 'ch');
  const ws = s.split(' '), cut = Math.ceil(ws.length / 2), a = document.createElement('div'), b = document.createElement('div'); el.append(a, b);
  return [...pieces(a, words(ws.slice(0, cut).join(' ')), 'ch'), ...pieces(b, words(ws.slice(cut).join(' ')), 'ch')];
};
// textos
const HEAD = [[LAP0 + .5, br(6) - .1, CFG.laptopHead], [PH0 + .45, br(10), CFG.phoneHead], [br(11) + .35, HIT[2][0] - .05, CFG.duoHead]]
  .map(([a, b, s]) => { const el = document.createElement('div'); el.className = 'head'; el.style.top = (PORT ? .13 : .06) * H + 'px'; $('stage').appendChild(el); return { a, b, ps: pieces(el, words(s), 'ch') }; });
const nomas = pieces($('nomas'), words(CFG.problem[0]), 'ch'), desc = pieces($('desc'), words(CFG.problem[1]), 'ch');
const todo = pieces($('todo'), words(CFG.promise[0]), 'ch'); $('pilltxt').textContent = CFG.promise[1];
const STACK = CFG.stack.map(w => { const d = document.createElement('div'); d.className = 'line'; d.textContent = w; $('stack').appendChild(d); return d; });
const ctrl = document.createElement('div'); ctrl.className = 'mega'; ctrl.style.position = 'absolute'; $('stack').appendChild(ctrl); const ctrlPs = pieces(ctrl, words(CFG.stackEnd), 'ch');
const comoPs = twoLines($('como'), CFG.bridge);
const scrPs = pieces($('scr'), words(CFG.decode), 'ch');
const wordPs = pieces($('word'), [[CFG.brand.name, '']], 'ch'), tag = pieces($('tag'), words(CFG.brand.tagline), 'w'), url = pieces($('url'), [[CFG.brand.url, 'g']], 'ch');
if (A.logo) $('logo1').src = $('logo2').src = A.logo; else $('logo1').style.display = $('logo2').style.display = 'none';
if (!CFG.brand.appStore) $('b1').remove(); if (!CFG.brand.googlePlay) $('b2').remove();
const badges = ['b1', 'b2'].map($).filter(Boolean);
// un solo degradado por línea aunque cada letra se anime aparte
document.querySelectorAll('#stage .mega, #stage .head, #stage .big, #stage .url, #stage .line').forEach(el => { const gs = [...el.querySelectorAll('.ch.grad')]; if (!gs.length) return;
  const L = g => g.offsetLeft + g.parentElement.offsetLeft, x0 = Math.min(...gs.map(L)), x1 = Math.max(...gs.map(g => L(g) + g.offsetWidth));
  gs.forEach(g => { g.style.backgroundSize = (x1 - x0) + 'px 100%'; g.style.backgroundPosition = -(L(g) - x0) + 'px 0'; }); });
const logoIn = (lg, t, l) => { lg.style.opacity = clamp(l * 1.4); lg.style.transform = `translateY(${Math.sin(t * 1.6) * 6}px) scale(${lerp(.4, 1, l)}) rotate(${(1 - l) * -12}deg)`; lg.style.filter = `blur(${(1 - clamp(l)) * 16}px) drop-shadow(0 30px 40px rgba(0,0,0,.12))`; };

function render(t) {
  // 1 · lo de antes, tachado en cada golpe (compás 0)
  { const el = $('strike'), sw = $('sw'), n = CFG.strike.length, i = clamp(Math.floor((t - bt(0)) / BEAT), 0, n - 1);
    if (t < bt(n) + .05) { const [w, g] = one(CFG.strike[i]); if (sw.textContent !== w) { sw.textContent = w; sw.className = g ? 'grad' : ''; } slam(el, t, bt(i), bt(i + 1));
      const L = seg(t, bt(i) + .12, bt(i) + .34, E.io);
      Object.assign($('bar').style, { left: -sw.offsetWidth * .04 + 'px', width: sw.offsetWidth * 1.08 + 'px', transform: `scaleX(${L}) rotate(-2deg)`, opacity: L > 0 ? 1 : 0 });

  scramble(desc, t, bt(5), br(2), .05, true);
  // 3 · logo + promesa con la píldora «+» (compás 2 → primer golpe)
  const e3 = HIT[0][0];
  logoIn($('logo1'), t, seg(t, br(2), br(2) + .8, E.back) * (1 - seg(t, e3 - .25, e3, E.in)));
  rise(todo, t, br(2) + .1, e3, .04);
  const pk = seg(t, br(2) + .4, br(2) + .9) * (1 - seg(t, e3 - .25, e3, E.in)); const pill = $('pill'), d = $('dash');
  d.setAttribute('width', Math.max(0, pill.offsetWidth - 4)); d.setAttribute('height', Math.max(0, pill.offsetHeight - 4)); d.setAttribute('rx', (pill.offsetHeight - 4) / 2);
  d.style.strokeDashoffset = -t * 40; pill.style.opacity = pk; pill.style.filter = `blur(${(1 - pk) * 12}px)`;
  pill.style.transform = `scale(${lerp(.7, 1, E.back(clamp((t - br(2) - .4) / .9)))})`; $('plus').style.transform = `rotate(${(1 - pk) * -180}deg)`;
  // 4 · los tres golpes de cada frase
  const sl = $('slam'); let shown = -1;
  for (let g = 0; g < 3 && shown < 0; g++) shown = seq(sl, t, CFG.hitWords[g], HIT[g], HE[g], .14);
  // 5 · titulares de los equipos
  HEAD.forEach(h => rise(h.ps, t, h.a, h.b, .028));
  // 6 · lista, una línea por golpe → frase final (compás 6)
  STACK.forEach((dv, i) => { const a = bt(24 + i), k = seg(t, a, a + .45), o = seg(t, bt(27) - .12, bt(27) + .1, E.in);
    dv.style.opacity = k * (1 - o); dv.style.filter = `blur(${(1 - k) * 20 + o * 20}px)`; dv.style.transform = `translateX(${(1 - k) * (i % 2 ? 260 : -260)}px) scale(${1 - o * .1})`; });
  rise(ctrlPs, t, bt(27), br(7), .035, { dy: 1, rot: 14, blur: 24 });
  // 7 · puente antes del segundo grupo de golpes (compás 7)
  rise(comoPs, t, br(7), HIT[1][0], .035, { dy: 1, rot: 10 });
  // 8 · texto que se descifra (compás 10)
  scramble(scrPs, t, br(10), br(11), .065, false);
  // 9 · cierre
  logoIn($('logo2'), t, seg(t, END0, END0 + .9, E.back));
  rise(wordPs, t, END0 + .3, 0, .06, { dy: 1, rot: 0, blur: 22 }); rise(tag, t, END0 + .7, 0, .08, { dy: .8, rot: 0 }); rise(url, t, END0 + 1.2, 0, .035, { dy: .8, rot: 0 });
  badges.forEach((b, i) => { const a = END0 + 1.7 + i * BEAT, k = seg(t, a, a + .7);
    b.style.opacity = k; b.style.filter = `blur(${(1 - k) * 14}px)`; b.style.transform = `translateY(${(1 - k) * 50}px) scale(${lerp(.85, 1, E.back(clamp((t - a) / .7)))})`; });

  const fl = (o, k) => { o.position.y += Math.sin(t * 1.3 + k) * .05; o.rotation.z += Math.sin(t * .9 + k) * .012; };

  lid.rotation.x = lerp(Math.PI / 2 - .02, -.32, seg(t, LAP0 + .1, LAP0 + 1.8, E.out));
  const tv = seg(t, PH0 + .4, PH0 + 1.5) * (1 - seg(t, br(10) - .45, br(10), E.in));
  tiles.forEach((m, i) => { const u = m.userData, a = u.a + t * .35 * u.sp, rad = u.r * lerp(.4, .85, tv) * (PORT ? .55 : 1);
    m.position.set(Math.cos(a) * rad * 1.2, u.y * (PORT ? 1.4 : .8) + Math.sin(t * 1.2 + i) * .15 + (1 - tv) * -1.5, u.z + Math.sin(a) * .6 + (PORT ? -.6 : -.4));
    m.rotation.set(Math.sin(t + i) * .4, Math.cos(t * .8 + i) * .5, Math.sin(t * .6 + i * 2) * .3);

}
